<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/ress/dist/ress.min.css" />
    <link rel="stylesheet" href="./css/quiz.css">
    <script src="./js/quiz.js" defer></script>
    <title>問題一覧</title>
</head>

<body class="quiz-desktop">
    <main class="desktop-shell" aria-label="デスクトップ">
        <button class="desktop-item" type="button" data-problem="0">
            <img src="./img/folder.png" alt="問題1" class="folder-icon color-one">
            <span>問題 1</span>
        </button>

        <button class="desktop-item" type="button" data-problem="1">
            <img src="./img/folder.png" alt="問題2" class="folder-icon color-two">
            <span>問題 2</span>
        </button>

        <button class="desktop-item" type="button" data-problem="2">
            <img src="./img/folder.png" alt="問題3" class="folder-icon color-three">
            <span>問題 3</span>
        </button>

        <button class="desktop-item" type="button" data-problem="3">
            <img src="./img/folder.png" alt="問題4" class="folder-icon color-four">
            <span>問題 4</span>
        </button>

        <button class="desktop-item" type="button" data-problem="4">
            <img src="./img/folder.png" alt="問題5" class="folder-icon color-five">
            <span>問題 5</span>
        </button>
    </main>

    <div class="problem-modal" id="problem-modal" aria-hidden="true">
        <div class="problem-window" role="dialog" aria-modal="true" aria-labelledby="problem-title">
            <div class="problem-window-header">
                <div class="window-actions" aria-hidden="true">
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
                <button type="button" class="window-close" id="window-close" aria-label="閉じる">✕</button>
            </div>

            <h2 id="problem-title">問題</h2>

            <div class="problem-body" id="problem-body"></div>
        </div>
    </div>
</body>

</html>
