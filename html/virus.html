<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://unpkg.com/ress/dist/ress.min.css" />

    <link rel="stylesheet" href="../css/virus.css">

    <script src="../js/virus.js" defer></script>

    <title>Security Error</title>
</head>

<body>

    <!-- ====================================== -->
    <!-- デスクトップアイコン -->
    <!-- ====================================== -->

    <div class="desktop-icons">

        <img src="../img/dustbox.png" alt="ゴミ箱" class="desktopIcon">
        <img src="../img/folder.png" alt="会議資料" class="desktopIcon">

        <figure class="desktopIcon-low-item">
            <img src="../img/WaterDog.png" alt="Water Dog" class="desktopIcon-low">
            <figcaption>Water Dog</figcaption>
        </figure>

        <figure class="desktopIcon-low-item">
            <img src="../img/mail.png" alt="メール" class="desktopIcon-low">
            <figcaption>メール</figcaption>
        </figure>

        <figure class="desktopIcon-low-item">
            <img src="../img/AI.png" alt="ハタンボ" class="desktopIcon-low">
            <figcaption>ハタンボ</figcaption>
        </figure>

    </div>

    <!-- ====================================== -->
    <!-- レッドアウト -->
    <!-- ====================================== -->

    <div class="red-screen">

        <div class="red-message">

            <div class="red-warning">
                ⚠
            </div>

            <div class="red-title">
                SECURITY ERROR
            </div>

            <div class="red-subtitle">
                システムに重大な問題が発生しました
            </div>

        </div>

    </div>


    <!-- ====================================== -->
    <!-- 大量の警告ウィンドウ -->
    <!-- ====================================== -->

    <div
        class="virus-windows"
        id="virus-windows"
    ></div>


    <!-- ====================================== -->
    <!-- タスクバー -->
    <!-- ====================================== -->

    <nav class="taskbar">

        <div class="taskbar-start">
            START
        </div>

        <div class="taskbar-window">
            SECURITY ERROR
        </div>

        <div class="taskbar-status">

            <span>
                OFFLINE
            </span>

            <time id="japan-time">
                --:--
            </time>

        </div>

    </nav>

</body>

</html>
