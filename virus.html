<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://unpkg.com/ress/dist/ress.min.css" />

    <link rel="stylesheet" href="./css/virus.css">

    <script src="./js/virus.js" defer></script>

    <title>Security Error</title>
</head>

<body>

    <!-- ====================================== -->
    <!-- デスクトップアイコン -->
    <!-- ====================================== -->

    <div class="desktop-icons">

        <img src="./img/dustbox.png" alt="ゴミ箱" class="desktopIcon">
        <img src="./img/folder.png" alt="会議資料" class="desktopIcon">

        <figure class="desktopIcon-low-item">
            <img src="./img/exe.png" alt="Water Dog" class="desktopIcon-low" id="exe">
            <figcaption>Water Dog</figcaption>
        </figure>

        <figure class="desktopIcon-low-item">
            <img src="./img/mail.png" alt="メール" class="desktopIcon-low mail-icon">
            <figcaption>メール</figcaption>
        </figure>

        <figure class="desktopIcon-low-item">
            <img src="./img/AI.png" alt="ネフユ" class="desktopIcon-low ai-icon">
            <figcaption>ネフユ</figcaption>
        </figure>

    </div>

    <!-- ====================================== -->
    <!-- レッドアウト -->
    <!-- ====================================== -->

    <div class="red-screen">

        <div class="red-message">

            <div class="red-warning">
                ⚠
            </div>

            <div class="red-title">
                SECURITY ERROR
            </div>

            <div class="red-subtitle">
                システムに重大な問題が発生しました
            </div>

        </div>

    </div>


    <!-- ====================================== -->
    <!-- 大量の警告ウィンドウ -->
    <!-- ====================================== -->

    <div
        class="virus-windows"
        id="virus-windows"
    ></div>


    <!-- ====================================== -->
    <!-- サポートAI吹き出し -->
    <!-- ====================================== -->

    <div class="support-ai" id="support-ai" aria-live="polite" aria-hidden="true" tabindex="0" role="button" aria-label="サポートAIに相談する">
        <div class="support-ai-bubble">
            <p>サポートAI</p>
            <span>不正な動作を検出しました。まずは画面を閉じずに、サポート窓口へ連絡してください。</span>
        </div>
        <img src="./img/AI.png" alt="サポートAI" class="support-ai-image">
    </div>


    <!-- ====================================== -->
    <!-- 問題表示 -->
    <!-- ====================================== -->

    <div class="quiz-overlay" id="quiz-overlay" aria-hidden="true">
        <div class="quiz-panel" role="dialog" aria-modal="true" aria-labelledby="quiz-title">
            <div class="quiz-header">
                <div class="quiz-header-left">
                    <span class="quiz-dock"></span>
                    <span class="quiz-dock"></span>
                    <span class="quiz-dock"></span>
                    <span class="quiz-dock"></span>
                </div>
                <button type="button" class="quiz-close" id="quiz-close" aria-label="閉じる">✕</button>
            </div>

            <h2 id="quiz-title">問題</h2>

            <div class="quiz-grid" id="quiz-grid"></div>
        </div>
    </div>


    <!-- ====================================== -->
    <!-- タスクバー -->
    <!-- ====================================== -->

    <nav class="taskbar">

        <div class="taskbar-start">
            START
        </div>

        <div class="taskbar-window">
            SECURITY ERROR
        </div>

        <div class="taskbar-status">

            <span>
                OFFLINE
            </span>

            <time id="japan-time">
                --:--
            </time>

        </div>

    </nav>

</body>

</html>
